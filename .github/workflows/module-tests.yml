name: Meraki PowerShell module checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  powershell-7-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline smoke tests
        shell: pwsh
        run: ./tests/Smoke.Tests.ps1
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester pure helper tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path @('./tests/Unit.Tests.ps1', './tests/Help.Tests.ps1', './tests/ConfigTemplates.Tests.ps1', './tests/ConfigDiff.Tests.ps1', './tests/ConfigApply.Tests.ps1') -CI

  powershell-7-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline smoke tests
        shell: pwsh
        run: ./tests/Smoke.Tests.ps1
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester pure helper tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path @('./tests/Unit.Tests.ps1', './tests/Help.Tests.ps1', './tests/ConfigTemplates.Tests.ps1', './tests/ConfigDiff.Tests.ps1', './tests/ConfigApply.Tests.ps1') -CI

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell 5.1 smoke tests
        shell: powershell
        run: ./tests/Smoke.Tests.ps1
      - name: Verify Windows PowerShell 5.1 engine
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          Write-Host "Running under Windows PowerShell $($PSVersionTable.PSVersion)"
      - name: Install Pester 5 in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
      - name: Run Pester tests under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Wrong PowerShell engine.' }
          Import-Module Pester -RequiredVersion 5.7.1 -Force -ErrorAction Stop
          if ((Get-Module Pester).Version.ToString() -ne '5.7.1') { throw 'Wrong Pester version.' }
          Invoke-Pester -Path @('./tests/Unit.Tests.ps1', './tests/Help.Tests.ps1', './tests/ConfigTemplates.Tests.ps1', './tests/ConfigDiff.Tests.ps1', './tests/ConfigApply.Tests.ps1') -CI
